name: F2 Frontier Integrity Fix

on:
  push:
    branches:
      - fix/f2-frontier-settlement-integrity-20260917

permissions:
  contents: write

concurrency:
  group: f2-frontier-integrity-fix
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/f2-frontier-settlement-integrity-20260917
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate patcher syntax
        run: node --check scripts/apply-f2-frontier-integrity-fix.mjs

      - name: Apply deterministic patch
        run: node scripts/apply-f2-frontier-integrity-fix.mjs

      - name: Tighten library id compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/v21/LibraryAdmissions.ts')
          s = p.read_text()
          s = s.replace(
              'export const LIBRARY_IDS = [...HUMAN_LIBRARY_IDS, ELF_LIBRARY_ID] as const;',
              'export const LIBRARY_IDS = [HUMAN_LIBRARY_IDS[0], ELF_LIBRARY_ID, HUMAN_LIBRARY_IDS[1], HUMAN_LIBRARY_IDS[2]] as const;'
          )
          s = s.replace(
              'export function libraryIdForAgent(world: Readonly<WorldState>, agent: Readonly<AgentState>): string {',
              'export function libraryIdForAgent(world: Readonly<WorldState>, agent: Readonly<AgentState>): (typeof LIBRARY_IDS)[number] {'
          )
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Full Vitest
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: complete F2 frontier and founding settlement integrity"
          git push origin HEAD:fix/f2-frontier-settlement-integrity-20260917
