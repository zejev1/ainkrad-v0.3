name: F2 Frontier Integrity Fix

on:
  push:
    branches:
      - fix/f2-frontier-settlement-integrity-20260917

permissions:
  contents: write

concurrency:
  group: f2-frontier-integrity-fix
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/f2-frontier-settlement-integrity-20260917
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate final audit patch syntax
        run: node --check scripts/apply-f2-frontier-integrity-final.mjs

      - name: Apply final audit correction
        run: node scripts/apply-f2-frontier-integrity-final.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Final regression preflight
        run: npx vitest run tests/v0_3_16_societyFoundation.test.ts tests/v0_3_20_regressions.test.ts tests/v0_3_22_frontierIntegrity.test.ts --minWorkers=1 --maxWorkers=1 --testTimeout=60000

      - name: Full Vitest
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified source correction
        shell: bash
        run: |
          if git diff --quiet -- src tests; then
            echo "No source/test changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: preserve race-neutral physical discovery"
          git push origin HEAD:fix/f2-frontier-settlement-integrity-20260917
