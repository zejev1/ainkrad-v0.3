name: F2 Candidate Final CI

on:
  push:
    branches:
      - ci/f2-candidate-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporary F2 validation branch
        uses: actions/checkout@v4

      - name: Reconstruct exact F2 candidate
        shell: bash
        run: |
          cat \
            ci/f2-patch/part-00.b64 \
            ci/f2-patch/part-01.b64 \
            ci/f2-patch/part-02a.b64 \
            ci/f2-patch/part-02b.b64 \
            ci/f2-patch/part-02c1-fixed.b64 \
            ci/f2-patch/part-02c2-fixed.b64 \
            ci/f2-patch/part-02d.b64 \
            ci/f2-patch/part-02e1-fixed.b64 \
            ci/f2-patch/part-02e2-fixed.b64 \
            ci/f2-patch/part-02f.b64 \
            ci/f2-patch/part-02g1-fixed.b64 \
            ci/f2-patch/part-02g2-fixed.b64 \
            ci/f2-patch/part-02h1.b64 \
            ci/f2-patch/part-02h2-fixed.b64 \
            ci/f2-patch/part-02i.b64 \
            > /tmp/f2.patch.gz.b64
          echo 'e0c3d02d3986d9c92a145d4bce1c6e91855da8a38e5f9901bb1f29f310744998  /tmp/f2.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/f2.patch.gz.b64 > /tmp/f2.patch.gz
          echo 'eed1c9ba583bd564b1b1d67a56d61e1ab5bbd910044076454d64668451c42469  /tmp/f2.patch.gz' | sha256sum -c -
          gunzip -c /tmp/f2.patch.gz > /tmp/f2.patch
          echo '6676640a5ca9e18bf3dd50124aadd68ea87d049446d0e05116fb9d297fb53be9  /tmp/f2.patch' | sha256sum -c -
          git apply --check /tmp/f2.patch
          git apply /tmp/f2.patch

          cat ci/f2-supplement/part-{00..11}.b64 > /tmp/f2-supplement.tar.gz.b64
          echo '70c5e86bbdc71c476164154e42845069ce729d0d5e44ade13846195310f1db9b  /tmp/f2-supplement.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/f2-supplement.tar.gz.b64 > /tmp/f2-supplement.tar.gz
          echo '76bc4bb1e172466715fef2d3045f691697ec9972a0571b30769d5f929db9e178  /tmp/f2-supplement.tar.gz' | sha256sum -c -
          tar -xzf /tmp/f2-supplement.tar.gz

          for patch in ci/f2-fix-overlay.patch ci/f2-fix-overlay2.patch ci/f2-fix-overlay3.patch ci/f2-fix-overlay4.patch; do
            printf '\n' >> "$patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Last regression
        run: npx vitest run --minWorkers=1 --maxWorkers=1 --testTimeout=60000 tests/v0_3_16_societyFoundation.test.ts

      - name: Vite production build
        run: npm run build
