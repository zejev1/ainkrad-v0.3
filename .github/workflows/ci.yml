name: Ainkrad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve IndexedDB test dependency
        run: |
          npm install --package-lock-only --save-dev --save-exact fake-indexeddb@6.2.2 --no-audit --no-fund
          node -e "console.log('AINKRAD_LOCK_ENTRY='+JSON.stringify(require('./package-lock.json').packages['node_modules/fake-indexeddb']))"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
