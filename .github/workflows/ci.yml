name: Ainkrad CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify command execution and profile a mature browser world
        run: |
          npx --no-install tsx scripts/profile-fix5.ts
          node scripts/profile-fix5-browser.mjs
      - run: npm run typecheck
      - run: npx --no-install vitest run tests/v0_3_21_responsiveClock.test.ts tests/v0_3_21_indexedDbContinuity.test.ts tests/persistence.test.ts --minWorkers=1 --maxWorkers=1 --testTimeout=60000
      - uses: actions/upload-artifact@v4
        with:
          name: AinkradFix5Diagnosis
          path: ${{ runner.temp }}/fix5-*profile*
          if-no-files-found: error
