name: Ainkrad CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check execution and profile the unchanged world engine
        run: npx --no-install tsx scripts/profile-catchup.ts
      - uses: actions/upload-artifact@v4
        with:
          name: AinkradFix4Diagnosis
          path: ${{ runner.temp }}/ainkrad-profile-world.json
          retention-days: 7
