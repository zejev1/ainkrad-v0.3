name: Ainkrad CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: World, persistence and geography tests
        run: npm run test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ainkrad-tests.json"
      - name: Production build
        run: npm run build
      - name: Install browser audit
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Produce old-main continuity fixture
        run: npx tsx scripts/fix5-browser-fixture.ts
      - name: Native browser and map audit
        run: node scripts/fix5-browser-smoke.mjs
      - name: Native IndexedDB performance comparison
        run: node scripts/fix5-browser-performance.mjs
      - name: Prepare audited SPCK checkout
        id: package
        run: node scripts/package-spck.mjs
      - name: SPCK archive
        uses: actions/upload-artifact@v4
        with:
          name: Ainkrad21Fix5
          path: ${{ steps.package.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
