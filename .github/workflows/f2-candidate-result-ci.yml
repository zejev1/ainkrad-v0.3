name: F2 Candidate Result CI

on:
  push:
    branches:
      - ci/f2-candidate-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact F2 candidate
        shell: bash
        run: |
          cat \
            ci/f2-patch/part-00.b64 \
            ci/f2-patch/part-01.b64 \
            ci/f2-patch/part-02a.b64 \
            ci/f2-patch/part-02b.b64 \
            ci/f2-patch/part-02c1-fixed.b64 \
            ci/f2-patch/part-02c2-fixed.b64 \
            ci/f2-patch/part-02d.b64 \
            ci/f2-patch/part-02e1-fixed.b64 \
            ci/f2-patch/part-02e2-fixed.b64 \
            ci/f2-patch/part-02f.b64 \
            ci/f2-patch/part-02g1-fixed.b64 \
            ci/f2-patch/part-02g2-fixed.b64 \
            ci/f2-patch/part-02h1.b64 \
            ci/f2-patch/part-02h2-fixed.b64 \
            ci/f2-patch/part-02i.b64 \
            > /tmp/f2.patch.gz.b64
          echo 'e0c3d02d3986d9c92a145d4bce1c6e91855da8a38e5f9901bb1f29f310744998  /tmp/f2.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/f2.patch.gz.b64 > /tmp/f2.patch.gz
          echo 'eed1c9ba583bd564b1b1d67a56d61e1ab5bbd910044076454d64668451c42469  /tmp/f2.patch.gz' | sha256sum -c -
          gunzip -c /tmp/f2.patch.gz > /tmp/f2.patch
          echo '6676640a5ca9e18bf3dd50124aadd68ea87d049446d0e05116fb9d297fb53be9  /tmp/f2.patch' | sha256sum -c -
          git apply --check /tmp/f2.patch
          git apply /tmp/f2.patch
          cat ci/f2-supplement/part-{00..11}.b64 > /tmp/f2-supplement.tar.gz.b64
          echo '1e9e074ee5644c4cc650307566956fd5643470743d5b34dddba25e0362f00806  /tmp/f2-supplement.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/f2-supplement.tar.gz.b64 > /tmp/f2-supplement.tar.gz
          echo 'a5cf7a51b962aa04b665dd23dbaf4b891ec985a1e77da1b19001177a63fdb3a6  /tmp/f2-supplement.tar.gz' | sha256sum -c -
          tar -xzf /tmp/f2-supplement.tar.gz

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical checks and record exact result
        id: checks
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          TC=$?
          npm run test > /tmp/vitest.log 2>&1
          VT=$?
          npm run build > /tmp/vite-build.log 2>&1
          VB=$?
          set -e

          if [ "$TC" -eq 0 ] && [ "$VT" -eq 0 ] && [ "$VB" -eq 0 ]; then
            OVERALL=PASS
          else
            OVERALL=FAIL
          fi

          mkdir -p ci
          {
            echo "F2 Candidate canonical GitHub validation"
            echo "overall=$OVERALL"
            echo "typecheck_exit=$TC"
            echo "vitest_exit=$VT"
            echo "vite_build_exit=$VB"
            echo "node=$(node --version)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo ""
            echo "--- typecheck tail ---"
            tail -n 30 /tmp/typecheck.log
            echo ""
            echo "--- vitest tail ---"
            tail -n 60 /tmp/vitest.log
            echo ""
            echo "--- vite build tail ---"
            tail -n 40 /tmp/vite-build.log
          } > ci/F2_VALIDATION_RESULT.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/F2_VALIDATION_RESULT.txt
          git commit -m "ci: record F2 validation result [skip ci]"
          git push origin HEAD:ci/f2-candidate-20260916

          if [ "$OVERALL" != PASS ]; then
            exit 1
          fi
