name: Inhabited homeland rescue validation
on:
  push:
    branches: [fix/inhabited-mainland-rescue-20260918]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inhabited-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'zejev1/ainkrad-v0.3' && github.ref == 'refs/heads/fix/inhabited-mainland-rescue-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply exact scoped integration
        run: |
          python3 scripts/apply-inhabited-rescue.py
          git rm scripts/apply-inhabited-rescue.py .github/workflows/inhabited-rescue-validate.yml
          git diff --stat
      - name: Typecheck
        run: npm run typecheck
      - name: Physical mainland and saved habitat regression
        run: npx vitest run tests/v0_3_22_inhabitedLandRescue.test.ts --minWorkers=1 --maxWorkers=1 --testTimeout=60000 --reporter=verbose
      - name: Full Vitest
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Commit the tested source only to the rescue branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/inhabited-mainland-rescue-20260918 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/geography/MainlandHomelands.ts src/world/geography/WorldTerrain.ts src/world/CompactSettlementLayout.ts src/world/WorldEngine.ts
          git commit -m 'fix: verified mainland reservations and lossless inhabited archipelago rescue'
          git push origin HEAD:refs/heads/fix/inhabited-mainland-rescue-20260918
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "Verified source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
