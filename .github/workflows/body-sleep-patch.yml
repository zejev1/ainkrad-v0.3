name: body-sleep-patch

on:
  push:
    branches: [fix/body-sleep-cycle]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/body-sleep-cycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch optimized body sleep integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/WorldEngine.ts')
          s=p.read_text()

          def once(old,new,label):
            global s
            if new in s:
              return
            if old not in s:
              raise SystemExit(f'missing patch anchor: {label}')
            s=s.replace(old,new,1)

          once(
          "import { advanceBodySleepV21, bodyFatigueDecisionBoostV21, bodyFatigueMobilityScaleV21, startBodySleepV21 } from '../v21/BodySleepV21';\n",
          "import { advanceBodySleepV21, bodyFatigueDecisionBoostV21, bodyFatigueMobilityScaleV21, isBodySleepingV21, nextBodyWakeWorldMinuteV21, startBodySleepV21, wakeDueSleepingBodiesV21 } from '../v21/BodySleepV21';\n",
          'sleep optimized import')

          once(
          "      const segmentWorldMinutes = Math.min(\n        remainingWorldMinutes,\n        untilBoundary,\n      );\n      this.advancePhysicalMovementForWorldMinutes(segmentWorldMinutes);",
          "      let segmentWorldMinutes = Math.min(\n        remainingWorldMinutes,\n        untilBoundary,\n      );\n      const segmentStartWorldMinute = clock.simulatedWorldMinutes + clock.pendingWorldMinutes;\n      wakeDueSleepingBodiesV21(this.state, segmentStartWorldMinute);\n      const nextWakeWorldMinute = nextBodyWakeWorldMinuteV21(this.state);\n      if (nextWakeWorldMinute !== undefined &&\n          nextWakeWorldMinute > segmentStartWorldMinute + PHYSICAL_TIME_EPSILON &&\n          nextWakeWorldMinute < segmentStartWorldMinute + segmentWorldMinutes - PHYSICAL_TIME_EPSILON) {\n        segmentWorldMinutes = nextWakeWorldMinute - segmentStartWorldMinute;\n      }\n      this.advancePhysicalMovementForWorldMinutes(segmentWorldMinutes);",
          'partition physical time at wake')

          once(
          "      this.state.calendar.elapsedWorldMinutes =\n        clock.simulatedWorldMinutes + clock.pendingWorldMinutes;\n\n      if (clock.pendingWorldMinutes + PHYSICAL_TIME_EPSILON < quantum) {",
          "      this.state.calendar.elapsedWorldMinutes =\n        clock.simulatedWorldMinutes + clock.pendingWorldMinutes;\n      wakeDueSleepingBodiesV21(this.state, this.state.calendar.elapsedWorldMinutes);\n\n      if (clock.pendingWorldMinutes + PHYSICAL_TIME_EPSILON < quantum) {",
          'wake at exact physical boundary')

          once(
          "      for (const agent of livingAgents) {\n        this.applyPassiveNeeds(agent, effectiveEnvironment);\n      }",
          "      for (const agent of livingAgents) {\n        // Sleeping bodies bypass hunger/stress/cognition work for this semantic\n        // boundary. A zero-energy body that collapses here is also blocked from\n        // all later work in the same boundary.\n        if (advanceBodySleepV21(this.state, agent)) continue;\n        this.applyPassiveNeeds(agent, effectiveEnvironment);\n        if (agent.energy <= 0) advanceBodySleepV21(this.state, agent);\n      }",
          'skip passive needs while sleeping')

          once(
          "        if (!deliberatingAgentIds.has(agent.id)) {\n          this.continueOrdinaryLifeBetweenDeliberations(agent, effectiveEnvironment);\n        }",
          "        if (!deliberatingAgentIds.has(agent.id) && !isBodySleepingV21(this.state, agent.id)) {\n          this.continueOrdinaryLifeBetweenDeliberations(agent, effectiveEnvironment);\n        }",
          'skip routine life while sleeping')

          once(
          "      if (!agent || !hasLibraryAdmission(this.state, agent, id)) continue;\n      if (agent.locationId === id && !agent.movement) {",
          "      if (!agent || !hasLibraryAdmission(this.state, agent, id) ||\n          isBodySleepingV21(this.state, agent.id)) continue;\n      if (agent.locationId === id && !agent.movement) {",
          'skip library study while sleeping')

          p.write_text(s)
          PY
      - name: Keep home sleep fully restorative
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v21/BodySleepV21.ts')
          s=p.read_text()
          old="  if (ownHome) return clamp01(0.96 + recovery * 0.04 - weatherPenalty * 0.15);"
          new="  if (ownHome) return 1;"
          if old in s:
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add focused sleep performance tests
        run: |
          cat >> tests/v0_3_22_bodySleep.test.ts <<'TS'

          describe('body sleep cost discipline',()=>{
            it('does no repeated work while sleep deadline is unchanged',()=>{
              const a=agent({energy:0}),w=world(a);
              advanceBodySleepV21(w,a);
              const first=bodySleepStateV21(w,'a')!;
              expect(first.wakesAtWorldMinute).toBe(360);
              for(let minute=1;minute<360;minute+=17){
                w.calendar.elapsedWorldMinutes=minute;
                expect(advanceBodySleepV21(w,a)).toBe(true);
                expect(bodySleepStateV21(w,'a')!.wakesAtWorldMinute).toBe(360);
              }
            });
          });
          TS
      - name: Typecheck and focused tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npx vitest run tests/v0_3_22_bodySleep.test.ts
      - name: Commit generated optimization
        run: |
          git config user.name zejev1
          git config user.email 128316040+zejev1@users.noreply.github.com
          git add src/world/WorldEngine.ts src/v21/BodySleepV21.ts tests/v0_3_22_bodySleep.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: integrate exact low-cost body sleep"
          git push origin HEAD:fix/body-sleep-cycle
